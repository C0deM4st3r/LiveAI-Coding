<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One AI. Every Pokémon Game. — Current goal</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:transparent;color:#edf5ff;font-family:Segoe UI,Arial,sans-serif}
.panel{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(200px,.75fr) minmax(0,1fr);align-items:center;gap:28px;padding:14px 28px;background:rgba(10,17,28,.96);border:1px solid #304457;border-radius:15px}
.goalbox{border-left:4px solid #78e4b9;padding-left:18px;min-width:0}.label{font-size:16px;color:#8eaac2;font-weight:650;letter-spacing:1.5px}
#goal{font-size:34px;font-weight:650;line-height:1.1;margin-top:6px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:17px;color:#b6cce0}#status{color:#85e6bb;font-weight:700}#demo{color:#ffd094;display:none}
.progress{min-width:0}#budget{font-size:30px;font-weight:650;margin:7px 0 9px;color:#d9eafa}.track{height:5px;border-radius:4px;background:#283c50;overflow:hidden}#fill{width:0;height:100%;background:#76dfb5;transition:width .2s}
.update{min-width:0}#outcome{font-size:22px;line-height:1.2;color:#dce6ee;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#detail{font-size:17px;color:#95afc5;margin-top:8px}.bad{color:#ffd094!important}
@media(max-width:900px){.panel{gap:16px;padding:16px 20px;grid-template-columns:minmax(0,1.35fr) minmax(150px,.65fr) minmax(0,1fr)}#goal{font-size:26px}#budget{font-size:24px}#outcome{font-size:18px}.tags{gap:7px;font-size:14px}}
@media(max-width:600px){.panel{grid-template-columns:minmax(0,1fr) 120px;padding:14px;gap:14px}.update{display:none}#goal{font-size:24px}.goalbox{padding-left:10px}.label{font-size:12px}.tags{flex-wrap:wrap;gap:3px 7px}}
</style>
<main class="panel">
 <section class="goalbox"><div class="label">CURRENT GOAL <span id="demo">· DEMO</span></div><div id="goal">Connect to mGBA and observe the game</div><div class="tags"><span id="status">Waiting for agent</span><span>·</span><span id="mode">Setup</span></div></section>
 <section class="progress"><div class="label" id="budget-label">ACTION BUDGET</div><div id="budget">No run yet</div><div class="track" role="progressbar" aria-label="Progress against the run limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div></section>
 <section class="update"><div class="label">LATEST OUTCOME</div><div id="outcome">Waiting for an observation</div><div id="detail">Feedback will appear after an action</div><div id="attempts" style="font-size:17px;color:#85e6bb;margin-top:4px"></div></section>
</main>
<script>
const demo=new URLSearchParams(location.search).get('demo')==='1';
const put=(id,text)=>document.getElementById(id).textContent=text;
function renderManaged(g){
 put('goal',g.title);put('status',g.status.toUpperCase());put('mode',g.source.replaceAll('_',' ')+' · Priority '+g.priority+(g.emergency?' · EMERGENCY':''));
 document.getElementById('status').classList.toggle('bad',['blocked','paused','failed'].includes(g.status));
 put('budget-label','GOAL ATTEMPTS');put('budget',g.attempts+' / '+(g.retry_limit+1)+' attempts');
 document.getElementById('fill').style.width='0%';document.querySelector('.track').setAttribute('aria-valuenow','0');
 put('outcome',(g.blockers.length?g.blockers.length+' blockers · '+g.blockers[0]:'')||(g.status==='completed'?g.evidence_count+' verified evidence records':g.failure_reasons.at(-1)?.reason||({ready:'Eligible · awaiting execution',paused:'Suspended · explicit resume needed',proposed:'Awaiting admission',active:'Execution active',cancelled:'Goal cancelled'}[g.status]||g.status)));
 const criteria=Object.keys(g.success_criteria).length;put('detail','Goal Manager · '+criteria+' success '+(criteria===1?'criterion':'criteria'));
 put('attempts',g.status==='completed'?'Completion verified':'Completion requires independent evidence');
}
function renderHybrid(h,s){
 const root=h.main_goal;if(!root)return;const terminal=['completed','failed','cancelled'].includes(root.status),rawFocus=terminal?root:h.active_goal||h.current_goal||root,focus=(h.display_goals||[]).find(g=>g.id===rawFocus.id)||rawFocus;renderManaged(focus);
 put('mode',focus.id===root.id?'Strategic · '+root.status.toUpperCase():'Strategic: '+root.title);
 put('budget-label','SESSION ACTIONS');put('budget',(s?.step||0)+(s?.continuous?' · continuous / no action cap':' / '+(s?.limit||'—')));
 const children=h.goals.filter(g=>g.id!==root.id&&g.status!=='cancelled'),done=children.filter(g=>g.status==='completed').length;
 put('detail','Skill: '+(h.skill?.name||'None')+' · '+done+'/'+children.length+' intermediate goals verified');
 put('attempts',root.status==='completed'?'Objective independently verified':root.status==='failed'?'Objective failed · history retained':root.status==='cancelled'?'Objective cancelled': 'Objective proof pending');
}
function render(s){
 const stale=s.active&&(!s.timestamp||Date.now()-Date.parse(s.timestamp)>10000);
 put('goal',s.goal);put('status',demo?'Preview · no game input':stale?'No recent agent events':s.status);
 document.getElementById('status').classList.toggle('bad',Boolean(stale||demo));document.getElementById('demo').style.display=demo?'inline':'none';
 put('mode',s.mode+(s.episode!=='—'?' · Ep '+Number(s.episode):''));
 const unit=s.budget_label||'actions';put('budget-label',unit==='checks'?'CHECK PROGRESS':unit==='observations'?'VISION / MEMORY':'ACTION BUDGET');
 put('budget',unit==='observations'?(s.qwen_calls||0)+' calls · '+(s.cache_hits||0)+' hits':s.limit?s.step+' / '+s.limit+' '+unit:s.step?s.step+' '+unit:'No run yet');
 const used=s.limit?Math.min(100,Math.max(0,s.step/s.limit*100)):0;
 document.getElementById('fill').style.width=used+'%';document.querySelector('.track').setAttribute('aria-valuenow',String(used));
 put('outcome',s.outcome.replaceAll('_',' '));
 put('detail',unit==='observations'?(s.scene||'Unknown scene'):typeof s.reward==='number'?'Reward '+s.reward.toFixed(2)+' · Total '+s.return.toFixed(2):'Selected / last action: '+(s.button?s.button.toUpperCase():'—'));
 const t=s.checkpoint_totals?.[s.checkpoint_name];put('attempts',t?'Attempt '+t.attempts+' · '+t.passed+' passed · '+t.failed+' failed · '+t.interrupted+' interrupted':'No checkpoint attempt yet');
}
let tick=0;
async function poll(){
 if(demo){const step=Math.floor(tick++/6)%40+1;render({goal:'Reach downstairs',status:'Running',mode:'Demo',episode:'001',step,limit:40,button:'up',outcome:'View changed; memory updated',reward:null,return:0,active:true,timestamp:new Date().toISOString()});}
 else{try{const [state,managed]=await Promise.allSettled([fetch('/status',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();}),fetch('/managed-goals',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();})]);if(state.status==='fulfilled')render(state.value);if(managed.status==='fulfilled'&&managed.value.available&&managed.value.current&&!(state.status==='fulfilled'&&state.value.active&&state.value.budget_label==='checks')){if(managed.value.hybrid?.main_goal)renderHybrid(managed.value.hybrid,state.status==='fulfilled'?state.value:null);else renderManaged(managed.value.current);}else if(state.status!=='fulfilled')throw Error('disconnected');}
 catch{put('status','Overlay disconnected');document.getElementById('status').classList.add('bad');}}
 setTimeout(poll,250);
}
poll();
</script>
</html>
